name: Update holdings JSON

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/updateDailyHoldings.ts'
      - 'scripts/dailyHoldingsUpdater.ts'
      - 'scripts/fetchHoldings.ts'
      - 'scripts/fetchHoldingsFull.ts'
      - '.github/workflows/update-holdings.yml'
  schedule:
    # KST 04:10 daily
    - cron: '10 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-holdings:
    runs-on: ubuntu-latest
    env:
      DATA4LIBRARY_KEY: ${{ secrets.DATA4LIBRARY_KEY }}
      LIB_CODE: ${{ vars.LIB_CODE || 'sample' }}
      LIB_NAME: ${{ vars.LIB_NAME || '달성군립도서관' }}
      # 수집 코드가 바뀐 직후에는 신간 조회 기본 범위와 같은 90일을 다시 읽어
      # 누락된 별치·소장 위치를 복구하고, 평소 예약 실행은 기존 7일 범위를 유지합니다.
      DAILY_LOOKBACK_DAYS: ${{ github.event_name == 'push' && '90' || vars.DAILY_LOOKBACK_DAYS || '7' }}
      PAGE_SIZE: ${{ vars.PAGE_SIZE || '300' }}
      API_CALL_LIMIT: '450'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update:holdings:daily
      - name: Touch metadata when no holdings changed
        run: |
          if git diff --quiet -- public/data/holdings.latest.json public/data/holdings.meta.json; then
            npm run update:holdings:touch-meta
          else
            echo "Daily update already changed holdings data. Skipping metadata-only touch."
          fi
      - name: Commit updated holdings
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Update daily holdings JSON'
          file_pattern: public/data/holdings.latest.json public/data/holdings.meta.json
