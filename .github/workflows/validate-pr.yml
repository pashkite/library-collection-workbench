name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: dist
          retention-days: 3
